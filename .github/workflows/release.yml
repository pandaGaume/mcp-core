name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm < 11.5.1 does not support OIDC trusted publishing.
      # Node 20.x ships with npm 10.x, so upgrade explicitly before publish.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true